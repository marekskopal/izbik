; The backend container's processes: FrankenPHP (the API, MCP and the Mercure hub) and the background job consumer.
[supervisord]
nodaemon=true
user=root
; nodaemon already mirrors supervisord's own messages (spawn errors, FATAL states) to stdout, the container log.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

; supervisorctl (`docker compose exec backend supervisorctl status`) needs an RPC endpoint.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true

; FrankenPHP failing for good (FATAL) stops the container, so Docker restarts it, as before supervisord ran it.
[eventlistener:fatal]
command=/usr/local/bin/supervisor-fatal.sh
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Background jobs from RabbitMQ (QueueConsumeCommand). Without RABBITMQ_HOST it exits with success at once and stays
; stopped (the jobs run in the web worker then). When the broker is unreachable it fails after a few seconds and is
; started again, however long the broker takes.
[program:queue-consumer]
command=php /app/bin/console queue:consume
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stopasgroup=true
killasgroup=true
